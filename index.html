<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HS Smart Support – Raise a Ticket</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* Background */
body {
    background:
        linear-gradient(
            rgba(238, 242, 247, 0.25),
            rgba(238, 242, 247, 0.25)
        ),
        url("healthcarebg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* Header */
.header {
    background: linear-gradient(90deg, #73a4cf, #73a4cf);
    color: white;
    text-align: center;
    padding: 25px 20px;
}

.logo {
    max-width: 120px;
    display: block;
    margin: 0 auto 10px;
}

/* Alert bar */
.marquee {
    background: #fff3cd;
    color: #856404;
    padding: 10px;
    overflow: hidden;
    white-space: nowrap;
}

.marquee-text {
    animation: scroll 15s linear infinite;
}

@keyframes scroll {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* Form card (DUAL SCROLL ENABLED) */
.container {
    max-width: 650px;
    margin: 40px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);

    /* This is the key */
    max-height: 70vh;
    overflow-y: auto;
}

/* Form fields */
label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 14px;
    color: #333;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

/* Submit */
input[type="submit"] {
    background: #0070d2;
    color: white;
    border: none;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
}

input[type="submit"]:hover {
    background: #005fb2;
}

/* Footer */
.footer {
    color: #000000;
    text-align: center;
    font-size: 12px;
    padding: 12px 0;
}

/* Mobile UX improvement */
@media (max-width: 768px) {
    .container {
        max-height: none;
        overflow: visible;
    }
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="logo" alt="HS Smart Support">
    <h2>HS Smart Support</h2>
    <p>We are here to help you resolve your issues quickly</p>
</div>

<div class="marquee">
    <div class="marquee-text">
        ⚠️ Please provide detailed information for faster resolution. High priority cases are addressed within 24 hours.
    </div>
</div>

<div class="container">
<form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00Dg5000002rLI5"
      method="POST">

<input type="hidden" name="orgid" value="00Dg5000002rLI5">
<input type="hidden" name="external" value="1">
<input type="hidden" name="retURL" value="thankyou.html">

<label>Subject</label>
<input type="text" name="subject" required>

<label>Type</label>
<select id="type" name="type" required>
    <option value="">--None--</option>
    <option>Billing</option>
    <option>Service Quality</option>
    <option>Technical</option>
    <option>Clinical</option>
    <option>Insurance</option>
</select>

<div id="subTypeContainer" style="display:none;">
    <label>Sub-Type</label>
    <select name="00Ng5000007lmzd">
        <option value="">--None--</option>
        <option>Consultation</option>
        <option>Emergency</option>
        <option>Telemedicine</option>
        <option>Lab Test</option>
    </select>
</div>

<label>Description</label>
<textarea name="description" required></textarea>

<label>Email</label>
<input type="email" name="email" required>

<label>Phone</label>
<input type="tel" name="phone">

<label>Priority</label>
<select name="priority" required>
    <option value="">--None--</option>
    <option>High</option>
    <option>Medium</option>
    <option>Low</option>
</select>

<input type="submit" value="Submit Ticket">
</form>
</div>

<div class="footer">
    © 2026 HS Smart Support. All rights reserved.
</div>

<script>
const typeField = document.getElementById("type");
const subTypeContainer = document.getElementById("subTypeContainer");

typeField.addEventListener("change", () => {
    subTypeContainer.style.display =
        typeField.value === "Clinical" ? "block" : "none";
});
</script>

</body>
</html>
