<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HS Smart Support – Raise a Ticket</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        linear-gradient(rgba(238,242,247,0.25), rgba(238,242,247,0.25)),
        url("healthcarebg.jpg");
    background-size: cover;
    background-position: center;
}

/* Header */
.header {
    background: #73a4cf;
    color: white;
    text-align: center;
    padding: 25px;
}

.logo {
    max-width: 120px;
    margin-bottom: 10px;
}

/* Notice bar */
.notice {
    background: #fff3cd;
    color: #856404;
    padding: 10px;
    text-align: center;
    font-size: 14px;
}

/* Form card */
.container {
    max-width: 650px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

/* Fields */
label {
    font-weight: 600;
    font-size: 14px;
    display: block;
    margin-bottom: 6px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

textarea {
    min-height: 120px;
}

/* Button */
input[type="submit"] {
    background: #0070d2;
    color: white;
    border: none;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
}

input[type="submit"]:hover {
    background: #005fb2;
}

/* Footer */
.footer {
    text-align: center;
    font-size: 12px;
    padding: 12px 0;
    color: #000;
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="logo" alt="HS Smart Support">
    <h2>HS Smart Support</h2>
    <p>We are here to help you resolve your issues quickly</p>
</div>

<div class="notice">
    ⚠️ Please provide detailed information for faster resolution.
</div>

<div class="container">
<form action="https://webto.salesforce.com/servlet/servlet.WebToCase"
      method="POST">

<!-- REQUIRED SALESFORCE FIELDS -->
<input type="hidden" name="orgid" value="00Dg5000002rLI5">
<input type="hidden" name="origin" value="Web">
<input type="hidden" name="retURL"
       value="https://bharani0805.github.io/Hs-Smart-Support/thankyou.html">

<label>Subject</label>
<input type="text" name="subject" required>

<label>Type</label>
<select name="type">
    <option value="">--None--</option>
    <option>Billing</option>
    <option>Service Quality</option>
    <option>Technical</option>
    <option>Clinical</option>
    <option>Insurance</option>
</select>

<label>Description</label>
<textarea name="description" required></textarea>

<label>Email</label>
<input type="email" name="email" required>

<label>Phone</label>
<input type="tel" name="phone">

<label>Priority</label>
<select name="priority">
    <option value="">--None--</option>
    <option>High</option>
    <option>Medium</option>
    <option>Low</option>
</select>

<input type="submit" value="Submit Ticket">
</form>
</div>

<div class="footer">
    © 2026 HS Smart Support. All rights reserved.
</div>

</body>
</html>
