<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-type" content="text/html; charset=UTF-8">
<title>Smart Support – Raise a Ticket</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background:
        linear-gradient(rgba(238,242,247,0.25),
                        rgba(238,242,247,0.25)),
        url("healthcarebg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.header {
    background: #73a4cf;
    color: white;
    text-align: center;
    padding: 25px 20px;
}

.logo {
    max-width: 120px;
    display: block;
    margin: 0 auto 10px;
}

.marquee {
    background: #fff3cd;
    color: #856404;
    padding: 10px;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: 40px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    max-height: 75vh;
    overflow-y: auto;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 14px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

textarea {
    min-height: 120px;
}

input[type="submit"] {
    background: #0070d2;
    color: white;
    border: none;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
}

input[type="submit"]:hover {
    background: #005fb2;
}

.footer {
    text-align: center;
    font-size: 12px;
    padding: 12px 0;
}

@media (max-width: 768px) {
    .container {
        max-height: none;
        overflow: visible;
    }
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="logo" alt="HS Smart Support">
    <h2>Smart Support</h2>
    <p>We are here to help you resolve your issues quickly</p>
</div>

<div class="marquee">
    ⚠️ Please provide detailed information for faster resolution.
</div>

<div class="container">

<form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00Dak00001Gl8VH" method="POST">

<input type=hidden name="orgid" value="00Dak00001Gl8VH">
<input type=hidden name="retURL" value="https://bharani0805.github.io/Hs-Smart-Support/thankyou.html">

<label for="subject">Subject</label><input  id="subject" maxlength="80" name="subject" size="20" type="text" /><br>

<label for="type">Type</label><select  id="type" name="type"><option value="">--None--</option><option value="Electrical">Electrical</option>
<option value="Electronic">Electronic</option>
<option value="Structural">Structural</option>
<option value="Other">Other</option>
<option value="Billing">Billing</option>
<option value="Service Feedback">Service Feedback</option>
<option value="Technical">Technical</option>
<option value="Appointment">Appointment</option>
<option value="Insurance">Insurance</option>
</select><br>

Sub -Type:<select  id="00Nak00005Bs9jl" name="00Nak00005Bs9jl" title="Sub -Type"><option value="">--None--</option><option value="In Clinic Consultation">In Clinic Consultation</option>
<option value="Emergency">Emergency</option>
<option value="Tele Consultation">Tele Consultation</option>
<option value="Lab Test">Lab Test</option>
</select><br>

To Visit?:<select  id="00Nak00005Csk4P" name="00Nak00005Csk4P" title="To Visit?"><option value="">--None--</option><option value="Cardiologist (Heart)">Cardiologist (Heart)</option>
<option value="General Physician">General Physician</option>
<option value="Orthopedic (Bones/ Muscles)">Orthopedic (Bones/ Muscles)</option>
<option value="Pediatrician (Baby)">Pediatrician (Baby)</option>
<option value="Pulmonologist (Lungs)">Pulmonologist (Lungs)</option>
</select><br>

<label for="email">Email</label><input  id="email" maxlength="80" name="email" size="20" type="text" /><br>

<label for="description">Description</label><textarea name="description"></textarea><br>

<label for="priority">Priority</label><select  id="priority" name="priority"><option value="">--None--</option><option value="High">High</option>
<option value="Medium">Medium</option>
<option value="Low">Low</option>
</select><br>

<input type="submit" name="submit">

</form>

<div class="footer">
    © 2026 Smart Support. All rights reserved.
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const typeField = document.getElementById("type");
    const subTypeContainer = document.getElementById("subTypeContainer");
    const subTypeField = document.getElementById("subType");

    const visitContainer = document.getElementById("visitContainer");
    const visitField = document.getElementById("visit");

    // Type → Sub-Type
    typeField.addEventListener("change", function () {
        if (this.value === "Appointment") {
            subTypeContainer.style.display = "block";
        } else {
            subTypeContainer.style.display = "none";
            subTypeField.value = "";
            visitContainer.style.display = "none";
            visitField.value = "";
        }
    });

    // Sub-Type → To Visit
    subTypeField.addEventListener("change", function () {
        const showVisitFor = [
            "Emergency",
            "In Clinic Consultation",
            "Tele Consultation"
        ];

        if (showVisitFor.includes(this.value)) {
            visitContainer.style.display = "block";
        } else {
            visitContainer.style.display = "none";
            visitField.value = "";
        }
    });

});
</script>

</body>
</html>
